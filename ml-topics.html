<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Machine Learning for Beginners</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .topic {
            background: #ecf0f1;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .topic:hover {
            background: #bdc3c7;
        }

        .topic h3 {
            margin: 0;
            color: #2c3e50;
        }

        .topic p {
            margin: 5px 0 0;
            color: #7f8c8d;
        }
    </style>
</head>

<body>
    <header>
        <h1>Learn Machine Learning for Beginners</h1>
    </header>

    <div class="container">
        <h2>Machine Learning Topics</h2>
        <div id="topics-container"></div> <!-- Container for dynamic topics -->
    </div>

    <script>
        // Array containing topics related to Machine Learning
        const topics = [
            { title: 'Introduction to Machine Learning', video: 'https://www.youtube.com/embed/Gv9_4yMHFhI' },
            { title: 'Types of Machine Learning (Supervised, Unsupervised, Reinforcement)', video: 'https://www.youtube.com/embed/ukzFI9rgwfU' },
            { title: 'Linear Regression in Machine Learning', video: 'https://www.youtube.com/embed/nk2CQITm_eo' },
            { title: 'Logistic Regression in Machine Learning', video: 'https://www.youtube.com/embed/yIYKR4sgzI8' },
            { title: 'Decision Trees and Random Forests', video: 'https://www.youtube.com/embed/J4Wdy0Wc_xQ' },
            { title: 'Support Vector Machines (SVM)', video: 'https://www.youtube.com/embed/efR1C6CvhmE' },
            { title: 'K-Nearest Neighbors (KNN)', video: 'https://www.youtube.com/embed/HVXime0nQeI' },
            { title: 'K-Means Clustering', video: 'https://www.youtube.com/embed/4b5d3muPQmA' },
            { title: 'Principal Component Analysis (PCA)', video: 'https://www.youtube.com/embed/FgakZw6K1QQ' },
            { title: 'Neural Networks and Deep Learning', video: 'https://www.youtube.com/embed/aircAruvnKk' },
            { title: 'Convolutional Neural Networks (CNN)', video: 'https://www.youtube.com/embed/YRhxdVk_sIs' },
            { title: 'Recurrent Neural Networks (RNN)', video: 'https://www.youtube.com/embed/UNmqTiOnRfg' },
            { title: 'Natural Language Processing (NLP)', video: 'https://www.youtube.com/embed/oi0JXuL19TA' },
            { title: 'Reinforcement Learning', video: 'https://www.youtube.com/embed/lDq_en8RNOo' },
            { title: 'Bias-Variance Tradeoff', video: 'https://www.youtube.com/embed/EuBBz3bI-aA' },
            { title: 'Model Evaluation Metrics (Accuracy, Precision, Recall, F1)', video: 'https://www.youtube.com/embed/HBi-P5j0Kec' }
        ];

        // Function to generate the HTML structure dynamically
        function createTopics() {
            const container = document.getElementById('topics-container');

            // Iterate over the topics array and create a div for each
            topics.forEach(topic => {
                const topicDiv = document.createElement('div');
                topicDiv.classList.add('topic');
                topicDiv.innerHTML = `
                    <h3>${topic.title}</h3>
                    <p>Click to learn more about ${topic.title}.</p>
                `;

                // Add click event to navigate to the video page
                topicDiv.addEventListener('click', () => {
                    window.location.href = `ml-video.html?video=${encodeURIComponent(topic.video)}&title=${encodeURIComponent(topic.title)}`;
                });

                container.appendChild(topicDiv);
            });
        }

        // Call the function to populate topics dynamically
        createTopics();
    </script>
</body>

</html>
