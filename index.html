<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | LearnOnline</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Modern and clean font */
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.0;
        }

        /* Header Styles */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo a {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-links .nav-link {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background 0.3s ease;
            padding: 10px 15px;
        }

        .nav-links .nav-link:hover,
        .nav-links .nav-link.active {
            background-color: #3498db;
            border-radius: 5px;
        }

        .btn-login {
            background-color: #3498db;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn-login:hover {
            background-color: #2980b9;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background-color: #333;
                position: absolute;
                top: 60px;
                right: 0;
                width: 100%;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .menu-toggle {
                display: flex;
            }
        }


        /* Main Section */
        main {
            background: url('https://elearningindustry.com/wp-content/uploads/2023/08/Shutterstock_2209948315.jpg') no-repeat center center/cover;
            height: 100vh;
            /* Make the main section take up the full height of the screen */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        main h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 600;
        }

        main p {
            font-size: 1.5rem;
            color: #ddd;
            margin-bottom: 30px;
            font-weight: 400;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
            /* Button hover effect */
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }

        footer p {
            font-size: 1rem;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #2980b9;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .main-content {
                padding: 50px 20px;
            }

            main h1 {
                font-size: 2.5rem;
            }

            main p {
                font-size: 1.2rem;
            }

            button {
                font-size: 1.1rem;
                padding: 12px 25px;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">LearnOnline</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="courses.html" class="nav-link">Courses</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="login.html" class="btn-login nav-link">Login</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>
        <h1>Welcome to Online Learning</h1>
        <p>Your gateway to a variety of online courses. Start learning today!</p>
        <a href="courses.html" class="button">Explore Courses</a>
    </main>

    <footer>
        <p>&copy; 2025 <a href="#">Online Learning Platform</a>. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
