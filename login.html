<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnOnline - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">LearnOnline</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="courses.html" class="nav-link">Courses</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="login.html" class="btn-login nav-link">Login</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>
        <div id="loginSection">
            <h1>Login to Your Account</h1>
            <form id="loginForm" onsubmit="return validateLogin()">
                <label for="email">Email Address:</label>
                <input type="email" id="loginEmail" name="email" placeholder="Enter your email address" required><br>

                <label for="password">Password:</label>
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required><br>

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="javascript:void(0);" onclick="showRegisterPage()">Create an account</a></p>
            <p><a href="forgot.html">Forgot your password?</a></p>
        </div>

        <div id="registerSection" style="display:none;">
            <h1>Create a New Account</h1>
            <form id="registerForm" onsubmit="return registerUser()">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="registerEmail" name="email" required><br><br>

                <label for="password">Password:</label>
                <input type="password" id="registerPassword" name="password" required><br><br>

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="javascript:void(0);" onclick="showLoginPage()">Login</a></p>
        </div>

    </main>

    <footer>
        <p>&copy; 2025 Online Learning Platform</p>
    </footer>
</body>

</html>
